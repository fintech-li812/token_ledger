[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenledger"
version = "0.1.0"
description = "Auditable AI token-usage ledger built on internal-control principles"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["token", "cost", "audit", "internal-control", "llm", "observability", "ledger"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.urls]
Repository = "https://github.com/fintech-li812/token_ledger"
Issues = "https://github.com/fintech-li812/token_ledger/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
tledger = "tokenledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]